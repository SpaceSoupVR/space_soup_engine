[package]
name    = "space_soup_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "space_soup_engine"
path = "src/lib.rs"

[dependencies]

space_soup_protocol = { path = "../space_soup_protocol" }

avatar_ik = { path = "../avatar_ik" }

space_soup_sky = { path = "../space_soup_sky" }

glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"

image = { version = "0.25.5", default-features = false, features = ["png", "jpeg"] }
rhai = { version = "1.19", features = ["sync"] }
physx = "0.19.0"
physx-sys = "0.11.5"
gltf = "1.4"
kira = "0.12.1"
mint = "0.5"
